spring.application.name=authService
server.port=8080
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
# Cookie flags (docker-compose passes COOKIE_SECURE / COOKIE_SAME_SITE; without this
# mapping those env vars would not bind to app.cookie.* and would be silently ignored)
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}
