services:
  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build: ./authService
    container_name: auth-service
    ports:
      - "8080:8080"
    environment:
      #Redis
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      # PostgreSQL (referenced by application.properties)
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      # RabbitMQ (Spring relaxed binding: SPRING_RABBITMQ_* -> spring.rabbitmq.*)
      SPRING_RABBITMQ_HOST: ${RABBITMQ_HOST}
      SPRING_RABBITMQ_PORT: ${RABBITMQ_PORT}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      # JWT
      JWT_SECRET_KEY: ${SECURITY_JWT_SECRET_KEY}
      # COOKIES
      COOKIE_SECURE: ${COOKIE_SECURE}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification-service:
    build: ./notificationService
    container_name: notification-service
    ports:
      - "8081:8081"
    environment:
      WEBSITE_URL: ${WEBSITE_URL}
      # RabbitMQ (Spring relaxed binding: SPRING_RABBITMQ_* -> spring.rabbitmq.*)
      SPRING_RABBITMQ_HOST: ${RABBITMQ_HOST}
      SPRING_RABBITMQ_PORT: ${RABBITMQ_PORT}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      # Resend email API
      RESEND_API_KEY: ${RESEND_API_KEY}

    depends_on:
      rabbitmq:
        condition: service_healthy

  api-gateway:
    build: ./apiGateway
    container_name: api-gateway
    ports:
      - "8762:8762"
    environment:
      # Internal Docker service URL for routing (application.yml -> AUTH_SERVICE_URL)
      AUTH_SERVICE_URL: http://auth-service:8080
      # Allowed CORS origin (application.yml globalcors -> WEBSITE_URL)
      WEBSITE_URL: ${WEBSITE_URL:-http://localhost:3000}
      # Same HS256 secret auth-service signs tokens with (application.yml -> jwt.secret-key)
      JWT_SECRET_KEY: ${SECURITY_JWT_SECRET_KEY}
    depends_on:
      auth-service:
        condition: service_started


  # Log storage / query engine. Not exposed to the host — only Grafana and
  loki:
    image: grafana/loki:3.3.2
    container_name: loki
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki

  # Log collector. Reads Docker container stdout/stderr via the Docker socket
  alloy:
    image: grafana/alloy:v1.5.1
    container_name: alloy
    user: root
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki

  # Dashboards / log explorer UI. Only Grafana is reachable from the host (3001).
  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # No sign-up, no anonymous access, no phone-home analytics.
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
  redis-cache:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
  postgres-data:
  loki-data:
  alloy-data:
  grafana-data:
