spring.application.name=purchase-service
server.port=8083

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}


# Flyway owns the purchase_db schema; Hibernate only validates against it.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=false

# Logging
logging.level.root=INFO
logging.level.com.moj.purchaseservice=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# Do not expose internal exception details to clients
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-exception=false
spring.web.error.include-stacktrace=never

credit-package.starter=100
credit-package.creator=600
credit-package.studio=2000

pricing-package.starter=10
pricing-package.creator=40
pricing-package.studio=100

video-analysis.credit-cost=10

spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB
max-video.size=2GB
mp4.content-type=video/mp4
