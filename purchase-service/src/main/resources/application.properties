spring.application.name=purchase-service
server.port=8083

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}


# RabbitMQ Consumer Retry Limit

spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=5s
spring.rabbitmq.listener.simple.default-requeue-rejected=false


# RabbitMQ Producer Retry Limit

spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.max-retries=3
spring.rabbitmq.template.retry.initial-interval=1s
spring.rabbitmq.template.retry.multiplier=2
spring.rabbitmq.template.retry.max-interval=5s

# Flyway owns the purchase_db schema; Hibernate only validates against it.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=false

# Logging
logging.level.root=INFO
logging.level.com.moj.purchaseservice=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# Do not expose internal exception details to clients
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-exception=false
spring.web.error.include-stacktrace=never

credit-package.starter=100
credit-package.creator=600
credit-package.studio=2000

pricing-package.starter=10
pricing-package.creator=40
pricing-package.studio=100

video-analysis.credit-cost=10

analyze-content.3-videos=50
analyze-content.5-videos=80
analyze-content.7-videos=100

spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB
max-video.size=2GB
mp4.content-type=video/mp4
